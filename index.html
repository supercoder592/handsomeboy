<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>教師節快樂 — 柏毅老師</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#efe8d8;
    --paper-2:#e9e1cf;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--paper);
    font-family:'LXGW WenKai TC','Kaiti TC','DFKai-SB',serif;
  }

  /* ── 和紙底層 ── */
  .paper{position:fixed;inset:0;pointer-events:none}
  .paper.base{
    background:
      radial-gradient(120% 90% at 50% 40%, #f3edde 0%, var(--paper) 55%, var(--paper-2) 100%);
  }
  .paper.fiber{
    opacity:.35;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='500' height='500'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='0.09 0.006' numOctaves='3' seed='7'/><feColorMatrix values='0 0 0 0 0.45 0 0 0 0 0.40 0 0 0 0 0.32 0 0 0 0.5 0'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>");
    background-size:900px 900px;
    mix-blend-mode:multiply;
  }
  .paper.grain{
    opacity:.5;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='3'/><feColorMatrix values='0 0 0 0 0.42 0 0 0 0 0.38 0 0 0 0 0.30 0 0 0 0.18 0'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>");
    background-size:240px 240px;
    mix-blend-mode:multiply;
  }
  .paper.vignette{
    background:radial-gradient(115% 115% at 50% 48%, transparent 60%, rgba(96,78,50,.10) 88%, rgba(80,62,38,.18) 100%);
  }
  /* 灑金紙：細金屑與少許大金箔 */
  .paper.goldfleck{
    opacity:.8;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='420'><g fill='%23b08c2e'><circle cx='30' cy='44' r='1.1' opacity='.5'/><circle cx='96' cy='18' r='.8' opacity='.4'/><circle cx='150' cy='70' r='1.4' opacity='.45'/><circle cx='210' cy='30' r='.9' opacity='.5'/><circle cx='280' cy='58' r='1.2' opacity='.35'/><circle cx='352' cy='24' r='.8' opacity='.5'/><circle cx='398' cy='86' r='1.3' opacity='.4'/><circle cx='58' cy='120' r='.9' opacity='.4'/><circle cx='130' cy='150' r='1.1' opacity='.5'/><circle cx='250' cy='128' r='.7' opacity='.45'/><circle cx='330' cy='160' r='1.5' opacity='.35'/><circle cx='20' cy='210' r='1.2' opacity='.45'/><circle cx='180' cy='222' r='.8' opacity='.5'/><circle cx='300' cy='236' r='1' opacity='.4'/><circle cx='390' cy='210' r='.9' opacity='.5'/><circle cx='70' cy='290' r='1.4' opacity='.4'/><circle cx='160' cy='320' r='.8' opacity='.45'/><circle cx='240' cy='300' r='1.1' opacity='.5'/><circle cx='340' cy='330' r='.9' opacity='.35'/><circle cx='40' cy='380' r='1' opacity='.5'/><circle cx='140' cy='400' r='1.3' opacity='.4'/><circle cx='270' cy='386' r='.8' opacity='.45'/><circle cx='370' cy='398' r='1.2' opacity='.5'/><ellipse cx='118' cy='86' rx='3.2' ry='2' opacity='.30' transform='rotate(24 118 86)'/><ellipse cx='308' cy='104' rx='2.6' ry='1.6' opacity='.28' transform='rotate(-18 308 104)'/><ellipse cx='86' cy='250' rx='3.4' ry='1.9' opacity='.26' transform='rotate(40 86 250)'/><ellipse cx='224' cy='356' rx='2.8' ry='1.7' opacity='.3' transform='rotate(-30 224 356)'/><ellipse cx='368' cy='280' rx='3' ry='1.8' opacity='.26' transform='rotate(12 368 280)'/></g></svg>");
    background-size:420px 420px;
  }

  /* ── 描金邊框與四角祥雲 ── */
  .frame{
    position:fixed;
    inset:12px;
    border:1.5px solid rgba(168,132,44,.55);
    pointer-events:none;
  }
  .frame::before{
    content:"";
    position:absolute;inset:6px;
    border:1px solid rgba(168,132,44,.32);
  }
  .frame i{
    position:absolute;
    width:58px;height:58px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none' stroke='%23a8842c' stroke-width='2' stroke-linecap='round'><path d='M8 56 Q8 28 24 19 Q40 10 42 22 Q43 32 33 33 Q25 34 25 27' opacity='.7'/><path d='M8 56 Q30 56 44 44 Q56 34 54 24' opacity='.5'/><circle cx='52' cy='14' r='2.2' fill='%23a8842c' stroke='none' opacity='.6'/></svg>");
    background-size:contain;
    background-repeat:no-repeat;
  }
  .frame i.tl{top:-4px;left:-4px}
  .frame i.tr{top:-4px;right:-4px;transform:scaleX(-1)}
  .frame i.bl{bottom:-4px;left:-4px;transform:scaleY(-1)}
  .frame i.br{bottom:-4px;right:-4px;transform:scale(-1,-1)}

  /* ── 金粉飄落 ── */
  .dust{
    position:fixed;inset:0;
    pointer-events:none;
    overflow:hidden;
    opacity:0;
    transition:opacity 2.4s ease;
  }
  .dust.show{opacity:1}
  .dust i{
    position:absolute;
    top:-4%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(244,214,126,.95), rgba(200,160,70,.25) 65%, transparent);
    animation:goldfall linear infinite;
    will-change:transform;
  }
  @keyframes goldfall{
    0%   {transform:translate3d(0,-6vh,0) rotate(0deg);   opacity:0}
    8%   {opacity:.9}
    85%  {opacity:.6}
    100% {transform:translate3d(var(--sway), 108vh, 0) rotate(220deg); opacity:0}
  }
  @media (prefers-reduced-motion:reduce){
    .dust{display:none}
  }

  /* ── 教師節彩蛋：金瓣 ── */
  .petals{
    position:fixed;inset:0;
    pointer-events:none;
    z-index:4;
    overflow:hidden;
  }
  .petals i{
    position:absolute;
    top:-6%;
    border-radius:72% 6% 68% 6% / 72% 6% 68% 6%;
    background:linear-gradient(135deg, #f3cf6e 0%, #d9a638 45%, #a4741d 85%, #7d5714 100%);
    border:1px solid rgba(120,84,20,.55);
    box-shadow:inset -2px -2px 4px rgba(120,84,20,.45), inset 2px 2px 3px rgba(255,240,200,.8), 0 1px 3px rgba(90,62,20,.25);
    opacity:0;
    animation:goldfall linear infinite;
    will-change:transform;
  }
  @media (prefers-reduced-motion:reduce){
    .petals{display:none}
  }

  /* ── 墨水層（覆蓋於紙上，纖維/顆粒層再疊其上以顯吸墨質感）── */
  #ink{
    position:fixed;inset:0;width:100%;height:100%;
    pointer-events:none;
  }

  /* ── 落款印 ── */
  .seal{
    position:fixed;
    right:max(24px, env(safe-area-inset-right));
    bottom:max(24px, env(safe-area-inset-bottom));
    writing-mode:vertical-rl;
    font-size:13px;
    letter-spacing:.35em;
    color:rgba(90,74,52,.5);
    pointer-events:none;
    opacity:0;
    transition:opacity 2.6s ease;
  }
  .seal.show{opacity:1}
  .seal em{
    font-style:normal;
    display:inline-block;
    margin-top:12px;
    padding:8px 5px;
    background:linear-gradient(160deg,#b6402c,#9a3220);
    color:#f6e9d4;
    border:1px solid rgba(120,32,20,.6);
    border-radius:3px;
    font-size:14px;
    letter-spacing:.15em;
    box-shadow:
      inset 0 0 6px rgba(70,16,10,.5),
      1px 2px 5px rgba(90,40,25,.35);
    transform:scale(1.5) rotate(-8deg);
    opacity:0;
    transition:transform .5s cubic-bezier(.2,1.4,.4,1), opacity .4s;
  }
  .seal.show em{
    transform:scale(1) rotate(-2deg);
    opacity:1;
    transition-delay:1.1s;
  }


  /* ── 封面：國三八班 + 紅絲綢蝴蝶結 ── */
  #coverBox{
    position:fixed;inset:0;
    perspective:1700px;
    perspective-origin:80% 50%;
    z-index:20;
  }
  #cover{
    position:absolute;inset:0;
    transform-origin:right center;
    transform:rotateY(0deg);
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    box-shadow:-14px 0 40px rgba(80,62,38,.35);
    background:
      radial-gradient(140% 100% at 60% 30%, rgba(255,255,255,.06), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 1px, transparent 1px 3px),
      linear-gradient(160deg, #33445f 0%, #273750 55%, #1d2a40 100%);
    transition:transform 1s cubic-bezier(.32,.72,.24,1), visibility 0s 1s;
    overflow:hidden;
  }
  #cover::before{ /* 右側書脊布紋 */
    content:"";
    position:absolute;right:0;top:0;bottom:0;width:60px;
    background:linear-gradient(270deg, rgba(0,0,0,.34), transparent);
  }
  #cover.open{
    transform:rotateY(106deg);
    visibility:hidden;
  }
  .cover-slip{
    position:absolute;
    top:6.5%;left:8%;
    background:linear-gradient(#f8f2e2, #efe6cf);
    border:1px solid rgba(90,74,52,.55);
    box-shadow:inset 0 0 0 3px rgba(255,255,255,.4), 3px 4px 10px rgba(0,0,0,.38);
    padding:26px 15px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.3em;
    font-size:clamp(30px, 7.5vw, 52px);
    line-height:1.1;
    color:#39301f;
  }
  .ribbon-v{
    position:absolute;top:-2%;bottom:-2%;left:50%;
    width:min(12vw, 60px);
    transform:translateX(-50%);
    background:
      linear-gradient(90deg,#8a2430 0%,#b13844 14%,#c94651 42%,#d55a63 50%,#c94651 58%,#b13844 86%,#8a2430 100%);
    box-shadow:0 2px 14px rgba(0,0,0,.35), inset 0 0 5px rgba(0,0,0,.18);
  }
  .ribbon-h{
    position:absolute;left:-2%;right:-2%;top:50%;
    height:min(12vw, 60px);
    transform:translateY(-50%);
    background:
      linear-gradient(180deg,#8a2430 0%,#b13844 14%,#c94651 42%,#d55a63 50%,#c94651 58%,#b13844 86%,#8a2430 100%);
    box-shadow:0 2px 14px rgba(0,0,0,.35), inset 0 0 5px rgba(0,0,0,.18);
  }
  .bow{
    position:absolute;left:50%;top:50%;
    width:min(82vw, 420px);
    transform:translate(-50%,-50%) rotate(-3deg);
    filter:drop-shadow(0 8px 14px rgba(0,0,0,.45));
  }
  .bow .loopL,.bow .loopR,.bow .tailL,.bow .tailR,.bow .knot{
    transform-box:view-box;
  }
  .bow .loopL,.bow .loopR{transform-origin:180px 108px}
  .bow .knot{transform-origin:180px 108px}
  .bow .tailL{transform-origin:174px 120px}
  .bow .tailR{transform-origin:186px 120px}
  /* 解開動畫 */
  #cover.untie .loopL{animation:bowLoopL .85s cubic-bezier(.5,0,.8,.4) forwards}
  #cover.untie .loopR{animation:bowLoopR .85s cubic-bezier(.5,0,.8,.4) .1s forwards}
  #cover.untie .tailL{animation:bowTailL 1.15s ease-in forwards}
  #cover.untie .tailR{animation:bowTailR 1.15s ease-in .08s forwards}
  #cover.untie .knot{animation:bowKnot .7s ease-in .55s forwards}
  @keyframes bowLoopL{45%{transform:scale(.55,.8) rotate(-14deg)}100%{transform:scale(.04,.2) rotate(-40deg);opacity:0}}
  @keyframes bowLoopR{45%{transform:scale(.55,.8) rotate(14deg)}100%{transform:scale(.04,.2) rotate(40deg);opacity:0}}
  @keyframes bowTailL{40%{transform:translate(-8px,10px) rotate(9deg)}100%{transform:translate(-46px,90px) rotate(30deg);opacity:0}}
  @keyframes bowTailR{40%{transform:translate(8px,10px) rotate(-9deg)}100%{transform:translate(46px,90px) rotate(-30deg);opacity:0}}
  @keyframes bowKnot{to{transform:scale(.08);opacity:0}}
  #cover.untie .ribbon-v{animation:ribSlideV .9s cubic-bezier(.55,0,.85,.4) .85s forwards}
  #cover.untie .ribbon-h{animation:ribSlideH .9s cubic-bezier(.55,0,.85,.4) .95s forwards}
  @keyframes ribSlideV{to{transform:translate(-50%,118vh);opacity:.7}}
  @keyframes ribSlideH{to{transform:translate(118vw,-50%);opacity:.7}}

  #glfail{
    position:fixed;inset:0;display:none;
    align-items:center;justify-content:center;text-align:center;
    color:#4a4237;font-size:15px;line-height:2;padding:24px;
  }

  /* ── 華麗：鎏金畫框 ── */
  .gframe{
    position:fixed;
    inset:12px;
    border:1px solid rgba(158,122,38,.42);
    box-shadow:inset 0 0 0 3px rgba(158,122,38,.0), 0 0 0 3px rgba(158,122,38,.10);
    pointer-events:none;
    z-index:4;
  }
  .gframe::before{
    content:"";
    position:absolute;
    inset:5px;
    border:1px solid rgba(158,122,38,.22);
  }
  .corner{
    position:fixed;
    width:56px;height:56px;
    fill:none;
    stroke:rgba(158,122,38,.55);
    stroke-width:2.6;
    stroke-linecap:round;
    stroke-linejoin:round;
    pointer-events:none;
    z-index:4;
  }
  .corner path{fill:rgba(158,122,38,.10)}
  .corner.tl{top:7px;left:7px}
  .corner.tr{top:7px;right:7px;transform:scaleX(-1)}
  .corner.bl{bottom:7px;left:7px;transform:scaleY(-1)}
  .corner.br{bottom:7px;right:7px;transform:scale(-1,-1)}

  /* ── 華麗：金塵微粒 ── */
  .dust{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
  .dust i{
    position:absolute;
    width:4px;height:4px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(240,210,130,.95) 0%, rgba(200,160,60,.55) 45%, transparent 70%);
    animation:dustFloat linear infinite alternate, dustTwinkle ease-in-out infinite;
    will-change:transform,opacity;
  }
  @keyframes dustFloat{
    from{transform:translate(0,0)}
    to{transform:translate(var(--dx), var(--dy))}
  }
  @keyframes dustTwinkle{
    0%,100%{opacity:.15}
    50%{opacity:.85}
  }

  /* ── 華麗：金光掠面（如光掃過鎏金） ── */
  .shine{
    position:fixed;inset:0;
    pointer-events:none;
    background:linear-gradient(115deg,
      transparent 40%,
      rgba(255,236,180,.16) 48%,
      rgba(255,246,214,.30) 50%,
      rgba(255,236,180,.16) 52%,
      transparent 60%);
    background-size:280% 100%;
    mix-blend-mode:soft-light;
    animation:shineSweep 7.5s ease-in-out infinite;
  }
  @keyframes shineSweep{
    0%{background-position:120% 0}
    55%{background-position:-60% 0}
    100%{background-position:-60% 0}
  }

  /* ── 毛筆 ── */
  #brush{
    position:fixed;
    left:0;top:0;
    pointer-events:none;
    z-index:5;
    opacity:0;
    transition:opacity .5s ease;
    will-change:transform;
  }
  #brush.show{opacity:1}
  #brush .btip{
    position:absolute;
    left:0;bottom:0;
    width:clamp(34px, 6vw, 46px);
    transform-origin:50% 100%;
    filter:drop-shadow(2px 4px 5px rgba(70,50,25,.28));
    will-change:transform;
  }
  #brush .btip svg{display:block;width:100%;height:auto}
  #brush .bshadow{
    position:absolute;
    left:0;bottom:0;
    width:26px;height:8px;
    border-radius:50%;
    background:radial-gradient(ellipse, rgba(70,50,25,.30), transparent 70%);
    transform:translate(-50%, 50%);
    will-change:transform,opacity;
  }
  @media (prefers-reduced-motion:reduce){
    .shine{animation:none}
    .dust i{animation:none;opacity:.3}
  }

  /* ── 左側書籤（朱紅）：首次寫完字才浮現 ── */
  .bookmarks{
    position:fixed;
    left:0;
    top:14%;
    display:flex;
    flex-direction:column;
    gap:14px;
    z-index:9;
    opacity:0;
    pointer-events:none;
    transform:translateX(-14px);
    transition:opacity 1.6s ease, transform 1.6s ease;
  }
  .bookmarks.show{
    opacity:1;
    pointer-events:auto;
    transform:translateX(0);
  }
  .bm{
    writing-mode:vertical-rl;
    font-family:inherit;
    font-size:15px;
    letter-spacing:.4em;
    color:#f5e8d8;
    background:linear-gradient(180deg,#a63a2b,#8c2f22);
    border:1px solid rgba(120,32,22,.7);
    border-left:none;
    border-radius:0 10px 10px 0;
    padding:16px 9px 18px;
    cursor:pointer;
    box-shadow:2px 3px 8px rgba(80,30,20,.28);
    transform:translateX(-6px);
    transition:transform .25s, background .25s;
    position:relative;
  }
  .bm::before{ /* 籤首的金結 */
    content:"";
    position:absolute;
    top:7px;left:50%;
    width:5px;height:5px;
    border-radius:50%;
    background:rgba(233,199,111,.9);
    transform:translateX(-50%);
  }
  .bm:hover{transform:translateX(-2px)}
  .bm.active{
    transform:translateX(0);
    background:linear-gradient(180deg,#c04834,#a63a2b);
    color:#fff3df;
    border-color:rgba(150,45,30,.8);
    box-shadow:2px 4px 12px rgba(120,40,25,.35);
  }

  /* ── 書頁（沿左側書脊翻頁） ── */
  .flipbox{
    position:fixed;inset:0;
    perspective:1700px;
    perspective-origin:80% 50%;
    pointer-events:none;
    z-index:6;
  }
  /* 翻頁葉：翻頁時載著主畫面快照被掀開／蓋回（右書脊） */
  .turnleaf{
    position:absolute;inset:0;
    z-index:2;
    pointer-events:none;
    background:
      radial-gradient(120% 90% at 50% 40%, #f3edde 0%, var(--paper) 55%, var(--paper-2) 100%);
    transform-origin:right center;
    transform:rotateY(0deg);
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    visibility:hidden;
    box-shadow:-14px 0 40px rgba(80,62,38,.30);
  }
  .turnleaf::before{
    content:"";
    position:absolute;
    right:0;top:0;bottom:0;
    width:56px;
    background:linear-gradient(270deg, rgba(80,62,38,.20), transparent);
    pointer-events:none;
    z-index:1;
  }
  .turnleaf.on{visibility:visible}
  .turnleaf.anim{transition:transform .85s cubic-bezier(.32,.72,.24,1)}
  .turnleaf.lifted{transform:rotateY(106deg)}
  .turnleaf img{
    position:absolute;inset:0;
    width:100%;height:100%;
  }


  /* 相簿頁：靜態底層，翻頁葉掀開後露出 */
  .album{
    position:absolute;inset:0;
    z-index:1;
    background:
      radial-gradient(120% 90% at 50% 40%, #f3edde 0%, var(--paper) 55%, var(--paper-2) 100%);
    visibility:hidden;
    pointer-events:none;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .album.show{ visibility:visible; pointer-events:auto; }
  .album .inner{
    max-width:560px;
    margin:0 auto;
    padding:56px 44px calc(56px + env(safe-area-inset-bottom)) 24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:44px;
  }
  .album h2{
    font-weight:400;
    font-size:20px;
    letter-spacing:.5em;
    text-indent:.5em;
    color:rgba(90,74,52,.75);
  }
  .album figure{
    background:#fbf8f0;
    padding:12px 12px 16px;
    border:1px solid rgba(110,92,62,.25);
    box-shadow:0 8px 22px rgba(80,62,38,.22);
    max-width:100%;
  }
  .album figure:nth-child(odd){transform:rotate(-1.1deg)}
  .album figure:nth-child(even){transform:rotate(1.2deg)}
  .album img{
    display:block;
    max-width:100%;
    height:auto;
  }
  .album figcaption{
    text-align:center;
    padding-top:12px;
    font-size:16px;
    letter-spacing:.25em;
    text-indent:.25em;
    color:rgba(90,74,52,.8);
  }
</style>
</head>
<body>
  <div class="paper base"></div>
  <div class="paper goldfleck"></div>
  <canvas id="ink"></canvas>
  <div class="shine"></div>
  <div class="paper fiber"></div>
  <div class="paper grain"></div>
  <div class="paper vignette"></div>

  <!-- 鎏金畫框 -->
  <div class="gframe"></div>

<script>
  /* 書籤切換：主畫面為第 1 頁，「相簿」翻來第 2 頁蓋上，「墨書」翻回 */
  (function(){
    const album = document.getElementById('album');
    const bmMain = document.getElementById('bmMain');
    const bmAlbum = document.getElementById('bmAlbum');
    const leaf = document.getElementById('turnleaf');
    const shot = document.getElementById('turnshot');
    let turning = false;
    function snap(){
      try{ shot.src = document.getElementById('ink').toDataURL('image/png'); }
      catch(e){ shot.removeAttribute('src'); }
    }
    bmAlbum.addEventListener('click', ()=>{
      if (turning || album.classList.contains('show')) return;
      turning = true;
      snap();
      leaf.classList.remove('anim','lifted');
      leaf.classList.add('on');           /* 平放：外觀即主畫面 */
      album.classList.add('show');        /* 相簿鋪在底下 */
      bmAlbum.classList.add('active');
      bmMain.classList.remove('active');
      document.body.classList.add('album-open');
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        leaf.classList.add('anim','lifted');   /* 主畫面那頁向右掀開 */
      }));
      setTimeout(()=>{ leaf.classList.remove('on'); turning = false; }, 900);
    });
    bmMain.addEventListener('click', ()=>{
      if (turning || !album.classList.contains('show')) return;
      turning = true;
      snap();
      leaf.classList.remove('anim');
      leaf.classList.add('lifted','on');  /* 自書脊立起 */
      bmMain.classList.add('active');
      bmAlbum.classList.remove('active');
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        leaf.classList.add('anim');
        leaf.classList.remove('lifted');       /* 主畫面那頁蓋回來 */
      }));
      setTimeout(()=>{
        album.classList.remove('show');
        leaf.classList.remove('on');
        document.body.classList.remove('album-open');
        turning = false;
      }, 900);
    });
  })();
</script>

/* ---------- WebGL 初始化 ---------- */
function getWebGLContext(canvas){
  const params = { alpha:true, depth:false, stencil:false, antialias:false, preserveDrawingBuffer:true };
  let gl = canvas.getContext('webgl2', params);
  const isWebGL2 = !!gl;
  if (!isWebGL2)
    gl = canvas.getContext('webgl', params) || canvas.getContext('experimental-webgl', params);
  if (!gl) return null;
  gl.clearColor(0,0,0,0);

  /* 依序嘗試：半浮點（畫質最佳）→ 8-bit（相容性最佳） */
  const candidates = [];
  if (isWebGL2){
    gl.getExtension('EXT_color_buffer_float');
    candidates.push({ internalFormat: gl.RGBA16F, type: gl.HALF_FLOAT, linear:true, tone:2.2 });
    candidates.push({ internalFormat: gl.RGBA8,   type: gl.UNSIGNED_BYTE, linear:true, tone:4.6 });
  } else {
    const hf = gl.getExtension('OES_texture_half_float');
    const hfLinear = !!gl.getExtension('OES_texture_half_float_linear');
    if (hf) candidates.push({ internalFormat: gl.RGBA, type: hf.HALF_FLOAT_OES, linear: hfLinear, tone:2.2 });
    candidates.push({ internalFormat: gl.RGBA, type: gl.UNSIGNED_BYTE, linear:true, tone:4.6 });
  }
  for (const c of candidates){
    if (supportRenderTextureFormat(gl, c.internalFormat, gl.RGBA, c.type))
      return { gl, texType:c.type, internalFormat:c.internalFormat,
               supportLinearFiltering:c.linear, tone:c.tone };
  }
  return null;
}
function supportRenderTextureFormat(gl, internalFormat, format, type){
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  try { gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, 4, 4, 0, format, type, null); }
  catch(e){ return false; }
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
  return gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
}

const ctx0 = getWebGLContext(canvas);
const USE2D = !ctx0;
let gl, texType, internalFormat, supportLinearFiltering, toneK = 2.2;

if (!USE2D){

/* ---------- Shader ---------- */
function compile(type, source){
  const s = gl.createShader(type);
  gl.shaderSource(s, source);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    console.error(gl.getShaderInfoLog(s));
  return s;
}
function createProgram(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, vs); gl.attachShader(p, fs); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS))
    console.error(gl.getProgramInfoLog(p));
  const uniforms = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i=0;i<n;i++){
    const name = gl.getActiveUniform(p,i).name;
    uniforms[name] = gl.getUniformLocation(p, name);
  }
  return { program:p, uniforms, bind(){ gl.useProgram(p); } };
}

const baseVertex = `
  precision highp float;
  attribute vec2 aPosition;
  varying vec2 vUv;
  void main(){
    vUv = aPosition * 0.5 + 0.5;
    gl_Position = vec4(aPosition, 0.0, 1.0);
  }`;

/* 落墨：濃芯 + 淡暈（滲染）。以加法混合直接疊上墨層，
   搭配剪裁區域只重繪落點附近的小方塊，弱 GPU 也流暢 */
const splatShader = `
  precision highp float;
  varying vec2 vUv;
  uniform float aspectRatio;
  uniform vec2 point;
  uniform float coreRadius, coreInk, haloRadius, haloInk;
  void main(){
    vec2 p = vUv - point;
    p.x *= aspectRatio;
    float d2 = dot(p, p);
    float add = exp(-d2 / coreRadius) * coreInk
              + exp(-d2 / haloRadius) * haloInk;
    gl_FragColor = vec4(add, 0.0, 0.0, 1.0);
  }`;

/* 顯示：墨以透明度覆於紙上；可調墨色，並以扭曲細絲雜訊生成「絲紋」 */
const displayShader = `
  precision highp float; precision highp sampler2D;
  varying vec2 vUv;
  uniform sampler2D uTexture;
  uniform float uAspect;
  uniform vec3 uInkColor, uVeinColor;
  uniform float uVeinAmt;
  uniform vec2 uSeed;
  uniform float uTone;
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float vnoise(vec2 p){
    vec2 i = floor(p), f = fract(p);
    f = f*f*(3.0-2.0*f);
    return mix(mix(hash(i), hash(i+vec2(1.0,0.0)), f.x),
               mix(hash(i+vec2(0.0,1.0)), hash(i+vec2(1.0,1.0)), f.x), f.y);
  }
  /* 細絲：拉伸 + 域扭曲的脊線，如墨中拉出的流絲 */
  float silk(vec2 q, vec2 seed){
    float w1 = vnoise(q*5.0 + seed) * 2.6;
    float w2 = vnoise(q*11.0 - seed*1.7) * 1.3;
    float n1 = vnoise(vec2(q.x*10.0 + w1, q.y*120.0 + w2));
    float n2 = vnoise(vec2(q.x*150.0 + w2*2.0, q.y*14.0 + w1) + seed);
    float t1 = smoothstep(0.90, 0.995, 1.0 - abs(2.0*n1 - 1.0));
    float t2 = smoothstep(0.92, 0.995, 1.0 - abs(2.0*n2 - 1.0));
    return max(t1, t2 * 0.8);
  }
  void main(){
    float d = texture2D(uTexture, vUv).r;
    float a = 1.0 - exp(-max(d, 0.0) * uTone);
    float g1 = hash(floor(gl_FragCoord.xy * 0.55));
    float g2 = hash(floor(gl_FragCoord.xy * 0.13) + 7.0);
    float grain = 0.88 + 0.09 * g1 + 0.09 * g2;
    a = clamp(a * grain, 0.0, 1.0);

    vec2 q = vec2(vUv.x * uAspect, vUv.y);
    float thread = silk(q, uSeed) * uVeinAmt;
    /* 絲只在墨實處顯現 */
    thread *= smoothstep(0.18, 0.55, a);
    vec3 col = mix(uInkColor, uVeinColor, thread);

    gl_FragColor = vec4(col * a, a);   /* 預乘透明 */
  }`;

let progSplat, progDisplay, quad, createFBO;
if (!USE2D){
  const bv = compile(gl.VERTEX_SHADER, baseVertex);
  progSplat   = createProgram(bv, compile(gl.FRAGMENT_SHADER, splatShader));
  progDisplay = createProgram(bv, compile(gl.FRAGMENT_SHADER, displayShader));

  /* 全螢幕四邊形 */
  quad = (()=>{
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,-1,1,1,1,1,-1]), gl.STATIC_DRAW);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0,1,2,0,2,3]), gl.STATIC_DRAW);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.enableVertexAttribArray(0);
    return (target)=>{
      if (target){
        gl.viewport(0, 0, target.width, target.height);
        gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
      } else {
        gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      }
      gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
    };
  })();

  /* 墨層 FBO */
  createFBO = function(w, h){
    gl.activeTexture(gl.TEXTURE0);
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    const filter = supportLinearFiltering ? gl.LINEAR : gl.NEAREST;
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, w, h, 0, gl.RGBA, texType, null);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
    gl.viewport(0, 0, w, h);
    gl.clear(gl.COLOR_BUFFER_BIT);
    return {
      texture, fbo, width:w, height:h,
      attach(id){
        gl.activeTexture(gl.TEXTURE0 + id);
        gl.bindTexture(gl.TEXTURE_2D, texture);
        return id;
      }
    };
  };
}
let dyeA;
function initInkLayer(){
  if (USE2D){
    c2d.setTransform(1,0,0,1,0,0);
    c2d.clearRect(0, 0, canvas.width, canvas.height);
    return;
  }
  const maxSide = 1600;
  const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
  const scale = Math.min(1, maxSide / Math.max(w, h));
  dyeA = createFBO(Math.max(2, Math.round(w*scale)), Math.max(2, Math.round(h*scale)));
}

/* ---------- 尺寸 ---------- */
function resizeCanvas(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.floor(canvas.clientWidth * dpr);
  const h = Math.floor(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h){
    canvas.width = w; canvas.height = h;
    return true;
  }
  return false;
}
resizeCanvas();
initInkLayer();

/* ---------- 落墨 ---------- */
function stamp(x, y, coreR, coreInk, haloR, haloInk){
  if (USE2D){ stamp2D(x, y, coreR, coreInk, haloR, haloInk); return; }
  const dw = dyeA.width, dh = dyeA.height;
  // 只重繪落點附近的小方塊（半徑取暈圈的 3.4 倍標準差）
  const radPx = Math.ceil(3.4 * Math.sqrt(haloR) * dh) + 2;
  const cx = Math.round(x * dw), cy = Math.round(y * dh);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);              // 墨量純加法
  gl.enable(gl.SCISSOR_TEST);
  gl.scissor(Math.max(0, cx - radPx), Math.max(0, cy - radPx), radPx * 2, radPx * 2);
  progSplat.bind();
  gl.uniform1f(progSplat.uniforms.aspectRatio, canvas.width / canvas.height);
  gl.uniform2f(progSplat.uniforms.point, x, y);
  gl.uniform1f(progSplat.uniforms.coreRadius, coreR);
  gl.uniform1f(progSplat.uniforms.coreInk, coreInk);
  gl.uniform1f(progSplat.uniforms.haloRadius, haloR);
  gl.uniform1f(progSplat.uniforms.haloInk, haloInk);
  quad(dyeA);
  gl.disable(gl.SCISSOR_TEST);
  gl.disable(gl.BLEND);
}
/* 2D 後備引擎：以徑向漸層直接把金墨疊在畫布上（無絲紋，其餘相同） */
function stamp2D(x, y, coreR, coreInk, haloR, haloInk){
  const W = canvas.width, H = canvas.height;
  const px = x * W, py = (1 - y) * H;
  const [r, g, b] = currentColor.base.map(v => Math.round(v * 255));
  const draw = (sigma2, ink)=>{
    if (ink <= 0) return;
    const rad = Math.max(0.6, Math.sqrt(sigma2) * H * 2.1);
    const grad = c2d.createRadialGradient(px, py, 0, px, py, rad);
    const a = Math.min(0.9, ink * 0.85);
    grad.addColorStop(0, `rgba(${r},${g},${b},${a})`);
    grad.addColorStop(0.55, `rgba(${r},${g},${b},${a * 0.35})`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    c2d.fillStyle = grad;
    c2d.beginPath();
    c2d.arc(px, py, rad, 0, Math.PI * 2);
    c2d.fill();
  };
  draw(coreR, coreInk);
  draw(haloR, haloInk * 0.6);
}

/* ================================================================
   筆畫幾何：hanzi-writer 座標系為 1024 em 方格、y 向上、基線 900。
   轉為畫布座標：cx = x * s；cy = (900 - y) * s。
   每一筆：
   1. 以 Path2D 畫出「這一筆」的輪廓，取其像素。
   2. 每個像素投影到中軸線，得到「沿筆畫的進度 u」。
   3. 依 u 由小到大落墨 → 真正沿筆勢由起筆寫到收筆。
   ================================================================ */
const GLYPH = 1024, S = 288;
const off = document.createElement('canvas');
off.width = S; off.height = S;
const octx = off.getContext('2d', { willReadFrequently:true });

function strokePixels(pathStr){
  octx.setTransform(1,0,0,1,0,0);
  octx.clearRect(0,0,S,S);
  const s = S / GLYPH;
  octx.setTransform(s, 0, 0, -s, 0, 900*s);
  octx.fillStyle = '#000';
  octx.fill(new Path2D(pathStr));
  const img = octx.getImageData(0,0,S,S).data;
  const pts = [];
  const step = 2;
  for (let py = 0; py < S; py += step)
    for (let px = 0; px < S; px += step)
      if (img[(py*S + px)*4 + 3] > 100)
        pts.push([px + 0.5, py + 0.5]);
  return pts;
}
function medianToCanvas(median){
  const s = S / GLYPH;
  return median.map(p => [p[0]*s, (900 - p[1])*s]);
}
/* 點到折線的投影：回傳沿線累積長度（進度） */
function projectOntoPolyline(pt, poly, cum){
  let best = Infinity, bestU = 0;
  for (let i=0;i<poly.length-1;i++){
    const ax=poly[i][0], ay=poly[i][1], bx=poly[i+1][0], by=poly[i+1][1];
    const dx=bx-ax, dy=by-ay;
    const len2 = dx*dx+dy*dy || 1e-6;
    let t = ((pt[0]-ax)*dx + (pt[1]-ay)*dy) / len2;
    t = Math.max(0, Math.min(1, t));
    const qx = ax+t*dx, qy = ay+t*dy;
    const d = (pt[0]-qx)**2 + (pt[1]-qy)**2;
    if (d < best){ best = d; bestU = cum[i] + t*(cum[i+1]-cum[i]); }
  }
  return bestU;
}
function polylineCum(poly){
  const cum = [0];
  for (let i=1;i<poly.length;i++)
    cum.push(cum[i-1] + Math.hypot(poly[i][0]-poly[i-1][0], poly[i][1]-poly[i-1][1]));
  return cum;
}

/* ---------- 書寫腳本 ---------- */
let script = [];
let scriptStart = 0;
let scriptIndex = 0;
/* 封面翻開後才動筆 */
let writingStarted = false;
window.__startWriting = function(){
  if (writingStarted) return;
  writingStarted = true;
  scriptStart = performance.now();
};
let writingDone = false;

/* 字形幾何快取：每個字的逐筆有序落墨點（S 空間）只算一次 */
const charGeoCache = {};
function getCharGeo(ch){
  if (charGeoCache[ch]) return charGeoCache[ch];
  const data = STROKE_DATA[ch];
  if (!data) return null;
  const strokes = [];
  for (let k = 0; k < data.strokes.length; k++){
    const poly = medianToCanvas(data.medians[k]);
    const cum = polylineCum(poly);
    const totalLen = cum[cum.length-1] || 1;
    const pts = strokePixels(data.strokes[k]);
    if (!pts.length) continue;
    const ordered = pts.map(p=>({ p, u: projectOntoPolyline(p, poly, cum)/totalLen }))
                       .sort((a,b)=>a.u-b.u);
    strokes.push({
      ordered,
      lenS: totalLen,
      start: poly[0],
      end: poly[poly.length-1]
    });
  }
  charGeoCache[ch] = strokes;
  return strokes;
}

function buildScript(){
  script = [];
  scriptIndex = 0;
  writingDone = false;
  document.getElementById('seal').classList.remove('show');
  if (typeof brushEl !== 'undefined'){
    brushOn = false;
    lastStampT = -1e9;
    brushEl.classList.remove('show');
  }

  const W = canvas.clientWidth, H = canvas.clientHeight;

  const mainLen = LINES[1].text.length;
  const baseSize = Math.min(H * 0.36, (W * 0.97) / (mainLen + (mainLen-1)*0.10));

  let t = 350;                       // 開場靜置
  const strokeGap = 48, charGap = 150, lineGap = 320;

  for (const line of LINES){
    const chars = [...line.text];
    const size = baseSize * line.sizeMul;
    const gap = size * 0.10;
    const totalW = chars.length * size + (chars.length-1) * gap;
    let cx0 = (W - totalW) / 2 + size / 2;
    const cy0 = H * line.yRatio;

    for (const ch of chars){
      const geo = getCharGeo(ch);
      if (!geo){ cx0 += size + gap; continue; }

      const scale = size / S;
      const toScreen = (p)=>[ cx0 + (p[0]-S/2)*scale, cy0 + (p[1]-S/2)*scale ];

      // 行書筆意：整字極輕微右上取勢
      const tilt = 0.035 + Math.random()*0.02;

      const coreSigma = Math.max(1.1, size * 0.009) / H;
      const haloSigma = coreSigma * 2.1;
      const coreR = coreSigma * coreSigma;
      const haloR = haloSigma * haloSigma;
      const thinSigma = Math.max(0.9, size * 0.006) / H;
      const thinR = thinSigma * thinSigma;

      let prevEnd = null;

      for (const stroke of geo){
        const ordered = stroke.ordered;

        // 行筆時間：依筆畫長度，疾徐有致
        const lenPx = stroke.lenS * scale;
        const dur = Math.min(190, Math.max(55, lenPx * 0.8)) * (0.85 + Math.random()*0.3);

        // 牽絲：上一筆收筆 → 這一筆起筆（行書連帶，淡細一線）
        const startPt = toScreen(stroke.start);
        if (prevEnd && Math.random() < 0.6){
          const dx = startPt[0]-prevEnd[0], dy = startPt[1]-prevEnd[1];
          const dist = Math.hypot(dx,dy);
          if (dist > size*0.04 && dist < size*0.55){
            const n = 9;
            // 微彎的過渡弧
            const mx = (prevEnd[0]+startPt[0])/2 - dy*0.12;
            const my = (prevEnd[1]+startPt[1])/2 + dx*0.12;
            for (let i=1;i<n;i++){
              const u = i/n;
              const a = (1-u)*(1-u), b = 2*u*(1-u), c = u*u;
              const gx = a*prevEnd[0] + b*mx + c*startPt[0];
              const gy = a*prevEnd[1] + b*my + c*startPt[1];
              // 牽絲中段最細最淡
              const w = Math.sin(u*Math.PI);
              script.push({
                t: t - strokeGap + u*strokeGap*0.9,
                x: gx/W, y: 1-gy/H,
                coreR: thinR, coreInk: 0.05 + 0.05*w,
                haloR: thinR*3, haloInk: 0.008
              });
            }
          }
        }

        // 筆勢時間曲線：起筆稍駐（頓）、行筆加速、收筆快甩
        const timeOf = (u)=> 0.14 * Math.min(u/0.08, 1) + 0.86 * Math.pow(u, 1.45);

        for (const {p, u} of ordered){
          const sp = toScreen(p);
          // 右上取勢（以字心為軸微旋）
          const rx = sp[0]-cx0, ry = sp[1]-cy0;
          const sx = cx0 + rx + ry*tilt;
          const sy = cy0 + ry - rx*tilt;

          // 起筆重頓：筆腹壓開，墨濃且筆畫加粗
          const press = 1.0 + 0.75 * Math.exp(-u * 7.0);
          let ink = 0.46 * press * (0.88 + Math.random()*0.24);
          let r = coreR * (0.72 + press * 0.38) * (0.9 + Math.random()*0.2);

          // 收筆出鋒：筆鋒收尖、墨漸枯、飛白利落
          if (u > 0.78){
            const dry = (u - 0.78) / 0.22;
            if (Math.random() < dry * 0.55) continue;   // 飛白留白
            ink *= 1.0 - dry * 0.30;
            r *= 1.0 - dry * 0.55;                       // 鋒尖收細
          }

          script.push({
            t: t + timeOf(u) * dur + (Math.random()-0.5)*12,
            x: sx / W,
            y: 1 - sy / H,
            coreR: r, coreInk: ink,
            haloR, haloInk: 0.02 * press
          });
        }

        prevEnd = toScreen(stroke.end);
        t += dur + strokeGap * (0.8 + Math.random()*0.5);
      }
      t += charGap;
      cx0 += size + gap;
    }
    t += lineGap;
  }
  script.sort((a,b)=>a.t-b.t);
  scriptStart = performance.now();
}

function runScript(now){
  if (!writingStarted) return;
  const elapsed = now - scriptStart;
  while (scriptIndex < script.length && script[scriptIndex].t <= elapsed){
    const p = script[scriptIndex++];
    stamp(p.x, p.y, p.coreR, p.coreInk, p.haloR, p.haloInk);
    /* 毛筆跟著筆尖走 */
    brushTX = p.x * canvas.clientWidth;
    brushTY = (1 - p.y) * canvas.clientHeight;
    lastStampT = now;
    if (!brushOn){
      brushOn = true;
      brushX = brushTX; brushY = brushTY - 30;
      brushEl.classList.add('show');
    }
  }
  if (!writingDone && scriptIndex >= script.length && script.length){
    writingDone = true;
    setTimeout(()=>{
      document.getElementById('seal').classList.add('show');
      document.querySelector('.bookmarks').classList.add('show');
      brushEl.classList.remove('show');           // 擱筆
      setTimeout(()=>{ brushOn = false; }, 700);
      if (isTeachersDay) startPetals();           // 教師節彩蛋：金瓣飄落
    }, 900);
  }
}

/* ---------- 墨色：金墨（暗金為體，亮金流絲為光澤） ---------- */
const currentColor = {
  base:[0.545, 0.400, 0.115],          // 沉金
  vein:[0.945, 0.820, 0.445],          // 亮金絲光
  amt: 0.55
};
let seed = [Math.random()*10, Math.random()*10];

/* ---------- 華麗：毛筆與金塵 ---------- */
const brushEl = document.getElementById('brush');
const btip = brushEl.querySelector('.btip');
const bshadow = brushEl.querySelector('.bshadow');
let brushOn = false, brushX = 0, brushY = 0, brushTX = 0, brushTY = 0, lastStampT = -1e9;

function updateBrush(now){
  if (!brushOn) return;
  const k = 0.38;
  brushX += (brushTX - brushX) * k;
  brushY += (brushTY - brushY) * k;
  const down = (now - lastStampT) < 130 && !writingDone;
  const lift = down ? 0 : -16;                       // 提筆
  const vx = brushTX - brushX;
  const lean = Math.max(-9, Math.min(9, vx * 0.12)); // 順筆勢傾斜
  /* 筆尖朝上指著書寫點，筆桿垂在字的下方（旋轉 180 度） */
  const ang = 167 + lean + (down ? 0 : 6);
  btip.style.transform =
    `translate(${brushX}px, ${brushY + lift}px) translate(-50%, 0) rotate(${ang}deg)`;
  bshadow.style.transform =
    `translate(${brushX}px, ${brushY}px) translate(-50%, -50%) scale(${down ? 1 : 1.6})`;
  bshadow.style.opacity = down ? 0.75 : 0.2;
}

/* 金塵微粒：緩慢漂浮、明滅 */
(function makeDust(){
  const dustEl = document.getElementById('dust');
  const n = 22;
  for (let i = 0; i < n; i++){
    const s = document.createElement('i');
    const size = 2 + Math.random() * 3;
    s.style.width = s.style.height = size + 'px';
    s.style.left = (Math.random() * 100) + '%';
    s.style.top = (Math.random() * 100) + '%';
    s.style.setProperty('--dx', (Math.random() * 70 - 35) + 'px');
    s.style.setProperty('--dy', (Math.random() * 90 - 45) + 'px');
    s.style.animationDuration = (6 + Math.random() * 8) + 's, ' + (2.2 + Math.random() * 3.2) + 's';
    s.style.animationDelay = (Math.random() * 6) + 's, ' + (Math.random() * 3) + 's';
    dustEl.appendChild(s);
  }
  dustEl.classList.add('show');
})();

/* 教師節彩蛋：滿屏金瓣，緩緩搖曳飄落 */
let petalsStarted = false;
function startPetals(){
  if (petalsStarted) return;
  petalsStarted = true;
  const box = document.createElement('div');
  box.className = 'petals';
  for (let i = 0; i < 26; i++){
    const p = document.createElement('i');
    const w = 16 + Math.random() * 14;
    p.style.width = w + 'px';
    p.style.height = w * (0.58 + Math.random() * 0.22) + 'px';
    p.style.left = (Math.random() * 100) + '%';
    p.style.setProperty('--sway', (Math.random() * 160 - 80) + 'px');
    p.style.animationDuration = (7 + Math.random() * 8) + 's';
    p.style.animationDelay = (Math.random() * 9) + 's';
    box.appendChild(p);
  }
  document.body.insertBefore(box, document.querySelector('.flipbox'));
}

/* ---------- 主迴圈 ---------- */
function render(){
  if (USE2D) return;   // 2D 引擎的墨已直接畫在畫布上
  progDisplay.bind();
  gl.uniform1i(progDisplay.uniforms.uTexture, dyeA.attach(0));
  gl.uniform1f(progDisplay.uniforms.uAspect, canvas.width / canvas.height);
  gl.uniform1f(progDisplay.uniforms.uTone, toneK);
  gl.uniform3fv(progDisplay.uniforms.uInkColor, currentColor.base);
  gl.uniform3fv(progDisplay.uniforms.uVeinColor, currentColor.vein);
  gl.uniform1f(progDisplay.uniforms.uVeinAmt, currentColor.amt);
  gl.uniform2f(progDisplay.uniforms.uSeed, seed[0], seed[1]);
  quad(null);
}
function frame(now){
  if (resizeCanvas()){
    initInkLayer();
    buildScript();
  }
  runScript(now);
  updateBrush(now);
  render();
  requestAnimationFrame(frame);
}
buildScript();
requestAnimationFrame(frame);

/* ---------- 視窗尺寸改變：重寫一張 ---------- */
let resizeTimer;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(()=>{
    resizeCanvas();
    initInkLayer();
    buildScript();
  }, 250);
});

})();
</script>
